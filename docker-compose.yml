services:
  diet-pro-planner:
    build: .
    container_name: diet-pro-planner
    restart: unless-stopped
    ports:
      - "8099:8099"
    env_file:
      - .env
    environment:
      # Local time for "today" (otherwise UTC: meals after midnight land on the previous day).
      - TZ=Europe/Madrid
    volumes:
      - ./data:/app/data
